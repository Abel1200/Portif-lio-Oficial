<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetShop Amigo Fiel</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

    <header>
        <div class="logo">🐾 Amigo Fiel</div>
        <nav>
            <a href="index.html">Início</a>
            <a href="servicos.html">Serviços</a>
            <a href="#contato">Contato</a>
        </nav>
    </header>

    <section class="hero">
        <h1>O melhor cuidado para o seu melhor amigo!</h1>
        <p>Oferecemos serviços de banho, tosa, veterinária e os melhores produtos do mercado.</p>
        <a href="servicos.html" class="btn">Ver Serviços</a>
    </section>

    <section id="contato" class="contato">
        <h2>Fale Conosco</h2>
        <form action="/enviar-contato" method="POST">
            <input type="text" name="nome" placeholder="Seu Nome" required>
            <input type="email" name="email" placeholder="Seu E-mail" required>
            <textarea name="mensagem" placeholder="Sua Mensagem ou Agendamento" required></textarea>
            <button type="submit">Enviar</button>
        </form>
    </section>

    <footer>
        <p>&copy; 2026 PetShop Amigo Fiel. Todos os direitos reservados.</p>
    </footer>

</body>
</html>
